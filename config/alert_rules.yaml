alerts:
  - name: high_p95_latency
    severity: critical
    condition: latency_p95_ms > 3000 for 10m
    duration: 10m
    type: symptom-based
    owner: ai-platform
    runbook: docs/alerts.md#high-p95-latency
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    duration: 5m
    type: symptom-based
    owner: ai-platform
    runbook: docs/alerts.md#high-error-rate
  - name: daily_cost_budget_exceeded
    severity: warning
    condition: daily_cost_usd > 2.5 for 15m
    duration: 15m
    type: symptom-based
    owner: ai-platform
    runbook: docs/alerts.md#daily-cost-budget-exceeded
