    objective: 3000
    target: 99.5
    note: P95 dưới 3 giây phù hợp với trải nghiệm tương tác của API lab.
  error_rate_pct:
    objective: 2
    target: 99.0
    note: Giữ tỷ lệ lỗi dưới 2% để phần lớn request hoàn tất ổn định.
