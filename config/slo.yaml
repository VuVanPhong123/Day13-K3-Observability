service: day13-observability-lab
window: 28d
slis:
  latency_p95_ms:
    objective: 3000
    target: 99.5
    note: 99.5% of requests should complete within 3000 ms over the 28-day window
  error_rate_pct:
    objective: 2
    target: 99.0
    note: Keep failed requests at or below 2% over the 28-day window
  daily_cost_usd:
    objective: 2.5
    target: 100.0
    note: Daily response cost budget is at most 2.50 USD
  quality_score_avg:
    objective: 0.75
    target: 95.0
    note: Mean response quality proxy should remain at or above 0.75
